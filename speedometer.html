<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Violet Speedo</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{--p1:#a855f7;--p2:#7c3aed;--pink:#ec4899;--cyan:#22d3ee;--amb:#fbbf24;--grn:#34d399;--red:#f43f5e;--bg:rgba(14,8,28,.82);--tx:#f5f3ff;--mut:#9f93c4}
*{box-sizing:border-box;margin:0;padding:0;user-select:none}
html,body{width:100%;height:100%;background:transparent;overflow:hidden;font-family:"Segoe UI",Roboto,Arial,sans-serif;color:var(--tx)}
#hud{position:fixed;right:24px;bottom:24px;width:340px;transition:opacity .3s}
.card{background:var(--bg);border:1px solid rgba(168,85,247,.45);border-radius:26px;box-shadow:0 0 30px rgba(124,58,237,.45),inset 0 0 40px rgba(168,85,247,.08);backdrop-filter:blur(8px);padding:10px 14px 14px;position:relative}
.top{display:flex;justify-content:space-between;align-items:center;cursor:move;font-size:11px;color:var(--mut);letter-spacing:2px;text-transform:uppercase;padding:2px 4px 0}
.top b{background:linear-gradient(90deg,var(--p1),var(--pink),var(--cyan));-webkit-background-clip:text;color:transparent}
.btns button{background:rgba(168,85,247,.15);border:1px solid rgba(168,85,247,.4);color:var(--tx);border-radius:8px;width:26px;height:24px;cursor:pointer;margin-left:4px;font-size:12px}
.btns button:hover{background:rgba(168,85,247,.45)}
.gauge{position:relative;width:260px;height:260px;margin:0 auto}
.gauge svg{width:100%;height:100%}
.trk{fill:none;stroke:rgba(255,255,255,.07);stroke-linecap:round}
.arc{fill:none;stroke-linecap:round;transition:none;filter:drop-shadow(0 0 6px var(--p1))}
.center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none}
#spd{font-size:76px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums;background:linear-gradient(180deg,#fff,#d8b4fe 60%,var(--p1));-webkit-background-clip:text;color:transparent;filter:drop-shadow(0 0 10px rgba(168,85,247,.7))}
#unit{font-size:12px;letter-spacing:4px;color:var(--cyan);margin-top:2px}
#gear{margin-top:6px;font-size:22px;font-weight:700;padding:1px 14px;border-radius:10px;border:1px solid var(--pink);color:var(--pink);box-shadow:0 0 12px rgba(236,72,153,.5)}
#rpmtxt{font-size:10px;color:var(--mut);margin-top:5px;letter-spacing:1px}
.bars{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:4px}
.bar{font-size:10px;color:var(--mut);text-transform:uppercase;letter-spacing:1px}
.bar i{display:block;height:7px;border-radius:5px;background:rgba(255,255,255,.08);margin-top:4px;overflow:hidden}
.bar i u{display:block;height:100%;width:0;border-radius:5px;text-decoration:none}
#fuelb{background:linear-gradient(90deg,var(--amb),var(--grn))}
#engb{background:linear-gradient(90deg,var(--red),var(--cyan))}
#bodb{background:linear-gradient(90deg,var(--pink),var(--p1))}
.ind{display:flex;justify-content:space-between;margin-top:12px;padding:8px 6px;background:rgba(255,255,255,.04);border-radius:14px}
.ic{font-size:17px;opacity:.18;transition:.2s;filter:grayscale(1)}
.ic.on{opacity:1;filter:none;text-shadow:0 0 10px currentColor}
.ic.blink{animation:bl .6s steps(1) infinite}
@keyframes bl{50%{opacity:.15}}
.stats{display:flex;justify-content:space-between;margin-top:10px;font-size:11px;color:var(--mut)}
.stats b{color:var(--tx);font-size:13px;display:block}
.panel{display:none;margin-top:10px;padding-top:10px;border-top:1px dashed rgba(168,85,247,.35);font-size:12px}
.panel.open{display:block}
.panel input,.panel select{width:100%;background:rgba(0,0,0,.4);border:1px solid rgba(168,85,247,.45);color:var(--tx);border-radius:9px;padding:7px 9px;margin:3px 0;font-size:12px;outline:none;user-select:text}
.panel input:focus{border-color:var(--cyan)}
.row{display:flex;gap:6px;align-items:center}
.row>*{flex:1}
.pb{background:linear-gradient(135deg,var(--p2),var(--pink));border:0;color:#fff;border-radius:9px;padding:7px 10px;cursor:pointer;font-weight:600;flex:none!important}
.tabs{display:flex;gap:6px;margin-bottom:6px}
.tabs .pb{opacity:.45;flex:1!important}.tabs .pb.act{opacity:1}
#res{max-height:130px;overflow:auto;margin-top:5px}
.it{display:flex;gap:8px;align-items:center;padding:4px;border-radius:8px;cursor:pointer}
.it:hover{background:rgba(168,85,247,.25)}
.it img{width:44px;height:32px;object-fit:cover;border-radius:5px;background:#222}
.it span{font-size:11px;line-height:1.2;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
#player iframe{width:100%;height:80px;border:0;border-radius:12px;margin-top:6px}
#player.yt iframe{height:1px;opacity:0;position:absolute;pointer-events:none}
#np{font-size:11px;color:var(--cyan);margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.small{font-size:10px;color:var(--mut);margin-top:4px;line-height:1.4}
label{font-size:10px;color:var(--mut);text-transform:uppercase;letter-spacing:1px}
#conn{width:7px;height:7px;border-radius:50%;background:var(--amb);display:inline-block;margin-right:5px;box-shadow:0 0 8px currentColor;color:var(--amb)}
#conn.live{background:var(--grn);color:var(--grn)}
</style>
</head>
<body>
<div id="hud">
 <div class="card">
  <div class="top" id="drag"><span><span id="conn"></span><b>VIOLET SPEEDO</b></span>
   <span class="btns"><button id="bm" title="Musik">♫</button><button id="bs" title="Pengaturan">⚙</button></span></div>

  <div class="gauge">
   <svg viewBox="0 0 300 300">
    <defs>
     <linearGradient id="g1" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#7c3aed"/><stop offset=".4" stop-color="#a855f7"/><stop offset=".7" stop-color="#ec4899"/><stop offset="1" stop-color="#fbbf24"/></linearGradient>
     <linearGradient id="g2" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22d3ee"/><stop offset=".6" stop-color="#a855f7"/><stop offset="1" stop-color="#f43f5e"/></linearGradient>
    </defs>
    <circle class="trk" cx="150" cy="150" r="128" stroke-width="14" id="t1"/>
    <circle class="arc" cx="150" cy="150" r="128" stroke-width="14" stroke="url(#g1)" id="a1"/>
    <circle class="trk" cx="150" cy="150" r="108" stroke-width="5" id="t2"/>
    <circle class="arc" cx="150" cy="150" r="108" stroke-width="5" stroke="url(#g2)" id="a2" style="filter:drop-shadow(0 0 4px var(--cyan))"/>
    <g id="ticks"></g>
   </svg>
   <div class="center"><div id="spd">0</div><div id="unit">KM/H</div><div id="gear">N</div><div id="rpmtxt">0 RPM</div></div>
  </div>

  <div class="bars">
   <div class="bar">⛽ Bensin <span id="fv">--</span><i><u id="fuelb"></u></i></div>
   <div class="bar">🔧 Mesin <span id="ev">--</span><i><u id="engb"></u></i></div>
   <div class="bar">🚗 Body <span id="bv">--</span><i><u id="bodb"></u></i></div>
  </div>

  <div class="ind">
   <span class="ic" id="i-eng" style="color:#f43f5e" title="Mesin">⚙️</span>
   <span class="ic" id="i-lt" style="color:#fbbf24" title="Lampu">💡</span>
   <span class="ic" id="i-hb" style="color:#22d3ee" title="Lampu jauh">🔆</span>
   <span class="ic" id="i-sb" style="color:#f43f5e" title="Sabuk">🪢</span>
   <span class="ic" id="i-hbk" style="color:#f43f5e" title="Rem tangan">🅿️</span>
   <span class="ic" id="i-dmg" style="color:#fb923c" title="Rusak">⚠️</span>
   <span class="ic" id="i-l" style="color:#34d399" title="Sein kiri">⬅️</span>
   <span class="ic" id="i-r" style="color:#34d399" title="Sein kanan">➡️</span>
  </div>

  <div class="stats">
   <div>MAX<b id="smax">0</b></div><div>TRIP<b id="strip">0.0 km</b></div><div>ODO<b id="sodo">0.0 km</b></div><div>JAM<b id="sclk">--:--</b></div>
  </div>

  <div class="panel" id="pm">
   <div class="tabs"><button class="pb act" id="tyt">YouTube</button><button class="pb" id="tsp">Spotify</button></div>
   <div class="row"><input id="q" placeholder="Cari lagu / tempel link..."><button class="pb" id="go">Cari</button></div>
   <div id="res"></div>
   <div id="np">Belum ada lagu</div>
   <div class="row" style="margin-top:6px"><button class="pb" id="pp">⏯</button><input id="vol" type="range" min="0" max="100" value="60"></div>
   <div id="player"></div>
  </div>

  <div class="panel" id="ps">
   <label>Satuan data yang dikirim server</label>
   <select id="inu"><option value="kmh">km/h (sudah dikonversi)</option><option value="mph">mph</option><option value="ms">m/s (native GTA)</option></select>
   <label>Tampilkan dalam</label>
   <select id="outu"><option value="kmh">KM/H</option><option value="mph">MPH</option></select>
   <label>Skala maksimum speedometer</label><input id="vmax" type="number" value="280">
   <label>Mode demo (tes tampilan tanpa data)</label>
   <select id="demo"><option value="auto">Otomatis (aktif jika tidak ada data)</option><option value="on">Selalu aktif</option><option value="off">Mati</option></select>
   <label>YouTube API key (opsional, lebih stabil)</label><input id="ytk" placeholder="AIza...">
   <label>Spotify Client ID / Secret (untuk pencarian)</label>
   <input id="spi" placeholder="Client ID"><input id="sps" placeholder="Client Secret" type="password">
   <button class="pb" id="sv" style="width:100%;margin-top:6px">Simpan</button>
   <div class="small">Tampilan HUD bisa digeser dengan drag di bagian atas kartu.</div>
  </div>
 </div>
</div>

<script>
const $=id=>document.getElementById(id);
const LS={get(k,d){try{const v=localStorage.getItem('vs_'+k);return v===null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem('vs_'+k,JSON.stringify(v))}catch(e){}}};
const S=Object.assign({inu:'kmh',outu:'kmh',vmax:280,demo:'auto',ytk:'',spi:'',sps:'',odo:0},LS.get('cfg',{}));
const save=()=>LS.set('cfg',S);

/* ---------- gauge geometry ---------- */
const ARC=.75;
function setupArc(id,r){const c=2*Math.PI*r,e=$(id);e.style.strokeDasharray=`${c*ARC} ${c}`;e.style.strokeDashoffset=c*ARC;e.setAttribute('transform','rotate(135 150 150)');e._len=c*ARC}
function setupTrk(id,r){const c=2*Math.PI*r,e=$(id);e.style.strokeDasharray=`${c*ARC} ${c}`;e.setAttribute('transform','rotate(135 150 150)')}
setupArc('a1',128);setupArc('a2',108);setupTrk('t1',128);setupTrk('t2',108);
function buildTicks(){let h='';const n=14;for(let i=0;i<=n;i++){const a=(135+270*i/n)*Math.PI/180,r1=88,r2=i%2?94:99,x1=150+r1*Math.cos(a),y1=150+r1*Math.sin(a),x2=150+r2*Math.cos(a),y2=150+r2*Math.sin(a);
 h+=`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${i%2?'#7c3aed':'#c4b5fd'}" stroke-width="${i%2?1.5:2.5}" stroke-linecap="round"/>`;
 if(i%2===0){const lr=78,lx=150+lr*Math.cos(a),ly=150+lr*Math.sin(a);h+=`<text x="${lx}" y="${ly+3}" fill="#9f93c4" font-size="8" text-anchor="middle">${Math.round(S.vmax*i/n)}</text>`}}
 $('ticks').innerHTML=h}
buildTicks();

/* ---------- state ---------- */
const V={speed:0,rpm:0,gear:0,fuel:null,eng:null,body:null,engineOn:null,lights:false,high:false,belt:null,hbrake:false,left:false,right:false};
const D={speed:0,rpm:0};let lastData=0,max=0,trip=0,demoT=0;

const num=v=>{v=Number(v);return isFinite(v)?v:null};
const bool=v=>v===true||v===1||v==='true'||v==='on';
function pick(o,keys){for(const k of keys){if(o[k]!==undefined&&o[k]!==null)return o[k]}return undefined}
function pct(v,big){v=num(v);if(v===null)return null;if(big&&v>100)v=v/10;else if(!big&&v<=1)v=v*100;return Math.max(0,Math.min(100,v))}

/* Adaptor: menerima berbagai format pesan dari server/skrip */
function ingest(d){
 if(!d||typeof d!=='object')return;
 let o=Object.assign({},d);
 for(const k of ['data','vehicle','veh','payload','status']){if(d[k]&&typeof d[k]==='object')Object.assign(o,d[k])}
 let any=false,x;
 if((x=num(pick(o,['speed','kmh','kph','mph','velocity','currentSpeed','vehicleSpeed'])))!==null){
  if(S.inu==='ms')x*=3.6;else if(S.inu==='mph')x*=1.609344;V.speed=x;any=true}
 if((x=num(pick(o,['rpm','RPM','engineRpm','currentRpm'])))!==null){V.rpm=x<=1.5?x:Math.min(1,x/9000);any=true}
 if((x=num(pick(o,['gear','currentGear','Gear'])))!==null){V.gear=x;any=true}
 if((x=pick(o,['fuel','fuelLevel','fuel_level','gas'])) !==undefined){V.fuel=pct(x,false)===null?null:(num(x)>1?Math.min(100,num(x)):num(x)*100);any=true}
 if((x=pick(o,['engineHealth','engine_health','engineHp','engineHP'])) !==undefined){V.eng=pct(x,true);any=true}
 if((x=pick(o,['bodyHealth','body_health','bodyHp','bodyHP'])) !==undefined){V.body=pct(x,true);any=true}
 if((x=pick(o,['engineOn','engine','engineRunning','isEngineOn']))!==undefined&&typeof x!=='object'){V.engineOn=bool(x);any=true}
 if((x=pick(o,['lights','lightsOn','headlights']))!==undefined){V.lights=bool(x)||num(x)>0;any=true}
 if((x=pick(o,['highbeams','highBeam','highbeam','high']))!==undefined){V.high=bool(x);any=true}
 if((x=pick(o,['seatbelt','belt','seatBelt','hasBelt']))!==undefined){V.belt=bool(x);any=true}
 if((x=pick(o,['handbrake','hbrake','handBrake','parkingBrake']))!==undefined){V.hbrake=bool(x);any=true}
 if((x=pick(o,['leftIndicator','indicatorLeft','left','signalLeft','blinkerLeft']))!==undefined){V.left=bool(x);any=true}
 if((x=pick(o,['rightIndicator','indicatorRight','right','signalRight','blinkerRight']))!==undefined){V.right=bool(x);any=true}
 if(any)lastData=performance.now()}
window.addEventListener('message',e=>{let d=e.data;if(typeof d==='string'){try{d=JSON.parse(d)}catch(_){return}}ingest(d)});
window.updateSpeedometer=ingest; window.ingest=ingest;

/* ---------- demo ---------- */
function demo(dt){demoT+=dt;const t=demoT/1000,s=Math.max(0,(Math.sin(t*.35)*.5+.5)*(S.vmax*.8));
 V.speed=s;const g=Math.min(6,Math.floor(s/45)+1);V.gear=s<2?0:g;V.rpm=.2+((s%45)/45)*.7;V.fuel=62;V.eng=88;V.body=71;V.engineOn=true;
 V.lights=true;V.high=Math.sin(t*.5)>.6;V.belt=true;V.hbrake=s<2;V.left=Math.sin(t*.8)>.85;V.right=false}

/* ---------- render loop ---------- */
const arc1=$('a1'),arc2=$('a2');let prev=performance.now();
function setOn(id,on,blink){const e=$(id);e.classList.toggle('on',!!on);e.classList.toggle('blink',!!on&&!!blink)}
function frame(now){const dt=now-prev;prev=now;
 const live=now-lastData<3000;
 $('conn').classList.toggle('live',live);$('conn').title=live?'Data terhubung':'Menunggu data server';
 if(S.demo==='on'||(S.demo==='auto'&&!live))demo(dt);
 D.speed+=(V.speed-D.speed)*Math.min(1,dt/90);D.rpm+=(V.rpm-D.rpm)*Math.min(1,dt/70);
 const f=S.outu==='mph'?.621371:1,shown=D.speed*f,vm=S.vmax*f;
 $('spd').textContent=Math.round(shown);$('unit').textContent=S.outu==='mph'?'MPH':'KM/H';
 arc1.style.strokeDashoffset=arc1._len*(1-Math.min(1,shown/vm));
 arc2.style.strokeDashoffset=arc2._len*(1-Math.min(1,D.rpm));
 $('gear').textContent=V.gear===0?(D.speed<1?'N':'R'):V.gear;
 $('rpmtxt').textContent=Math.round(D.rpm*9000)+' RPM';
 /* bars */
 const bar=(b,v,t)=>{$(b).style.width=(v===null?0:v)+'%';$(t).textContent=v===null?'--':Math.round(v)+'%'};
 bar('fuelb',V.fuel,'fv');bar('engb',V.eng,'ev');bar('bodb',V.body,'bv');
 /* indikator */
 setOn('i-eng',V.engineOn===false||(V.eng!==null&&V.eng<35));setOn('i-lt',V.lights);setOn('i-hb',V.high);
 setOn('i-sb',V.belt===false&&D.speed>5,true);setOn('i-hbk',V.hbrake);setOn('i-dmg',(V.body!==null&&V.body<40));
 setOn('i-l',V.left,true);setOn('i-r',V.right,true);
 /* statistik */
 if(D.speed>max)max=D.speed;const km=D.speed*dt/3600000;trip+=km;S.odo+=km;
 $('smax').textContent=Math.round(max*f);$('strip').textContent=(trip*f).toFixed(1)+(S.outu==='mph'?' mi':' km');$('sodo').textContent=(S.odo*f).toFixed(1)+(S.outu==='mph'?' mi':' km');
 requestAnimationFrame(frame)}
requestAnimationFrame(frame);
setInterval(()=>{const d=new Date();$('sclk').textContent=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')},5000);
setInterval(()=>{LS.set('cfg',S)},15000);

/* ---------- panels ---------- */
$('bm').onclick=()=>{$('pm').classList.toggle('open');$('ps').classList.remove('open')};
$('bs').onclick=()=>{$('ps').classList.toggle('open');$('pm').classList.remove('open')};
['inu','outu','vmax','demo','ytk','spi','sps'].forEach(k=>{$(k).value=S[k]});
$('sv').onclick=()=>{['inu','outu','demo','ytk','spi','sps'].forEach(k=>S[k]=$(k).value);S.vmax=Math.max(60,num($('vmax').value)||280);save();buildTicks();$('ps').classList.remove('open')};

/* ---------- drag ---------- */
(function(){const h=$('hud'),pos=LS.get('pos',null);if(pos){h.style.left=pos.x+'px';h.style.top=pos.y+'px';h.style.right='auto';h.style.bottom='auto'}
 let dr=null;$('drag').addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;const r=h.getBoundingClientRect();dr={dx:e.clientX-r.left,dy:e.clientY-r.top};e.target.setPointerCapture(e.pointerId)});
 $('drag').addEventListener('pointermove',e=>{if(!dr)return;const x=Math.max(0,Math.min(innerWidth-100,e.clientX-dr.dx)),y=Math.max(0,Math.min(innerHeight-60,e.clientY-dr.dy));h.style.left=x+'px';h.style.top=y+'px';h.style.right='auto';h.style.bottom='auto'});
 $('drag').addEventListener('pointerup',()=>{if(dr){const r=h.getBoundingClientRect();LS.set('pos',{x:r.left,y:r.top});dr=null}})})();

/* ---------- musik ---------- */
let mode='yt',cur=null;
$('tyt').onclick=()=>{mode='yt';$('tyt').classList.add('act');$('tsp').classList.remove('act')};
$('tsp').onclick=()=>{mode='sp';$('tsp').classList.add('act');$('tyt').classList.remove('act')};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function note(t){$('np').textContent=t}
function showRes(list){$('res').innerHTML=list.map((x,i)=>`<div class="it" data-i="${i}">${x.img?`<img src="${esc(x.img)}">`:''}<span>${esc(x.title)}</span></div>`).join('')||'<div class="small">Tidak ada hasil.</div>';
 $('res').querySelectorAll('.it').forEach(el=>el.onclick=()=>play(list[el.dataset.i]))}
function play(x){cur=x;const p=$('player');
 if(x.kind==='yt'){p.className='yt';p.innerHTML=`<iframe allow="autoplay; encrypted-media" src="https://www.youtube.com/embed/${x.id}?autoplay=1&enablejsapi=1&playsinline=1"></iframe>`;setTimeout(()=>ytCmd('setVolume',[+$('vol').value]),1500)}
 else{p.className='sp';p.innerHTML=`<iframe allow="autoplay; encrypted-media" src="https://open.spotify.com/embed/${x.type}/${x.id}?theme=0"></iframe>`}
 note('▶ '+x.title)}
function ytCmd(f,a){const fr=$('player').querySelector('iframe');if(fr&&cur&&cur.kind==='yt')fr.contentWindow.postMessage(JSON.stringify({event:'command',func:f,args:a||[]}),'*')}
let paused=false;$('pp').onclick=()=>{if(!cur)return;if(cur.kind==='yt'){ytCmd(paused?'playVideo':'pauseVideo');paused=!paused}else note('Gunakan tombol play di player Spotify')};
$('vol').oninput=e=>ytCmd('setVolume',[+e.target.value]);

function parseLink(q){let m=q.match(/(?:youtu\.be\/|v=|embed\/|shorts\/)([\w-]{11})/);if(m)return{kind:'yt',id:m[1],title:'YouTube '+m[1]};
 m=q.match(/spotify\.com\/(?:intl-\w+\/)?(track|album|playlist|episode|artist)\/(\w+)/);if(m)return{kind:'sp',type:m[1],id:m[2],title:'Spotify '+m[1]};return null}

async function ytSearch(q){
 if(S.ytk){try{const r=await fetch('https://www.googleapis.com/youtube/v3/search?part=snippet&type=video&maxResults=8&q='+encodeURIComponent(q)+'&key='+S.ytk);const j=await r.json();
  if(j.items)return j.items.map(i=>({kind:'yt',id:i.id.videoId,title:i.snippet.title,img:i.snippet.thumbnails.default.url}))}catch(e){}}
 for(const h of ['https://pipedapi.kavin.rocks','https://pipedapi.adminforge.de','https://api.piped.yt']){
  try{const r=await fetch(h+'/search?q='+encodeURIComponent(q)+'&filter=videos');const j=await r.json();

 throw new Error('Pencarian YouTube gagal. Isi API key di ⚙ atau tempel link video.')}
let spTok=null,spExp=0;
async function spToken(){if(spTok&&Date.now()<spExp)return spTok;if(!S.spi||!S.sps)throw new Error('Isi Spotify Client ID/Secret di ⚙, atau tempel link Spotify.');
 const r=await fetch('https://accounts.spotify.com/api/token',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded',Authorization:'Basic '+btoa(S.spi+':'+S.sps)},body:'grant_type=client_credentials'});
 const j=await r.json();if(!j.access_token)throw new Error('Kredensial Spotify salah.');spTok=j.access_token;spExp=Date.now()+(j.expires_in-60)*1000;return spTok}
async function spSearch(q){const t=await spToken();const r=await fetch('https://api.spotify.com/v1/search?type=track&limit=8&q='+encodeURIComponent(q),{headers:{Authorization:'Bearer '+t}});const j=await r.json();
 return j.tracks.items.map(i=>({kind:'sp',type:'track',id:i.id,title:i.name+' — '+i.artists.map(a=>a.name).join(', '),img:i.album.images.slice(-1)[0]?.url}))}
async function search(){const q=$('q').value.trim();if(!q)return;const l=parseLink(q);if(l){play(l);return}
 note('Mencari...');try{const r=mode==='yt'?await ytSearch(q):await spSearch(q);showRes(r);note('Pilih lagu')}catch(e){note(e.message)}}
$('go').onclick=search;$('q').addEventListener('keydown',e=>{e.stopPropagation();if(e.key==='Enter')search()});
